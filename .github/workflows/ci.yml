name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/suped.js --help
      - run: node bin/suped.js prompt
      - run: npm pack --dry-run

  site:
    name: site (suped.ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  computer:
    name: computer (image + end-to-end)
    runs-on: ubuntu-latest
    env:
      SUPED_IMAGE: suped-computer:ci
      SUPED_CONTAINER: suped-ci
      SUPED_VOLUME: suped-ci-home
      SUPED_TEST_TOOLS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: build image
        run: docker build -t "$SUPED_IMAGE" cli/docker
      - name: tools present
        run: |
          docker run --rm "$SUPED_IMAGE" bash -lc '
            set -e
            node -v; python3 --version; git --version; jq --version; sqlite3 --version
            ffmpeg -version | head -1; rg --version | head -1; uv --version; playwright --version
            test -f /etc/suped/prompt.md
            sudo -n true
          '
      - name: CLI, selected tools, persistence, and browser
        run: node cli/test/integration.js
