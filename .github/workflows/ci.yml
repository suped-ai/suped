name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/suped.js --help
      - run: node bin/suped.js prompt
      - run: npm pack --dry-run

  site:
    name: site (suped.ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  computer:
    name: computer (image + end-to-end)
    runs-on: ubuntu-latest
    env:
      SUPED_IMAGE: suped-computer:ci
      SUPED_CONTAINER: suped-ci
      SUPED_VOLUME: suped-ci-home
      SUPED_TEST_TOOLS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The base is what a first run gets. Check it has the everyday tools and,
      # just as importantly, that the optional software really is absent -- that
      # is the whole point of building it in about a minute.
      - name: build base image
        run: docker build -t suped-computer:ci-base cli/docker
      - name: base tools present, optional software absent
        run: |
          docker run --rm suped-computer:ci-base bash -lc '
            set -e
            node -v; python3 --version; git --version; jq --version; sqlite3 --version
            rg --version | head -1; uv --version; w3m -version | head -1; age --version
            test -f /etc/suped/prompt.md
            sudo -n true
            for absent in ffmpeg playwright cc; do
              if command -v "$absent" >/dev/null; then
                echo "$absent must not be in the base image" >&2
                exit 1
              fi
            done
          '
      # The end-to-end check launches Chromium, so it runs against an image with
      # the optional software built in.
      - name: build image with optional software
        run: |
          docker build -t "$SUPED_IMAGE" \
            --build-arg WITH_BROWSER=1 --build-arg WITH_MEDIA=1 --build-arg WITH_BUILD=1 \
            cli/docker
      - name: optional software present when it is asked for
        run: |
          docker run --rm "$SUPED_IMAGE" bash -lc '
            set -e
            ffmpeg -version | head -1; playwright --version; cc --version | head -1
          '
      - name: CLI, selected tools, persistence, and browser
        run: node cli/test/integration.js
